<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuChat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Purana service worker jo cached (purani) app dikha raha tha, usko
      // unregister kar dete hain — taaki browser hamesha fresh/latest
      // version load kare, aur "do splash screens" wala confusion na ho.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister())
        })
        if (window.caches) {
          caches.keys().then((names) => {
            names.forEach((name) => caches.delete(name))
          })
        }
      }
    </script>
  </body>
</html>
